# Anything that isn't the real hostname (raw IP hits, scanners with a bogus
# Host header) gets dropped before it's served, ahead of the real server block.
server {
  listen 8080 default_server;
  server_name _;
  return 444;
}

server {
  listen 8080;
  server_name prismgrc.co www.prismgrc.co;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 12m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Never serve dotfiles or source maps.
  location ~ /\. { return 404; }
  location ~* \.map$ { return 404; }

  # This stack has no PHP/CGI/ASP interpreter anywhere — these extensions can
  # only ever be scanner noise (mass-scanned CVEs for unrelated apps). Close
  # the connection instead of falling through to the SPA's 200 index.html, so
  # they don't show up as false-positive "hits" in logs later.
  location ~* \.(php\d?|phtml|asp|aspx|cgi|jsp|jspx)$ { return 444; }

  # Docker's embedded DNS; resolving per-request lets nginx start and survive api restarts.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
